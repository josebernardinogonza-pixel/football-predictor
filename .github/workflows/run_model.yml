name: Escaner de Apuestas 8h
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Deps
        run: pip install numpy scipy requests Pillow

      - name: Run Model
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python main.py

      - name: Send Telegram Image
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="🏆 Top Pick Liga MX (MXN) 🏆"

      - name: Save History
        run: |
          git config --global user.name "PredictorBot"
          git config --global user.email "bot@github.com"
          git add predictions_history.csv
          git commit -m "Update history [skip ci]" || echo "No changes"
          git push
