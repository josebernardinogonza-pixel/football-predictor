name: Bot de Apuestas Inteligente 8h

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde el móvil
  schedule:
    - cron: '0 */8 * * *' # Se ejecuta automáticamente cada 8 horas

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para guardar el historial CSV

    steps:
      - name: 1. Descargar Codigo del Repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar Entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar Librerias Necesarias
        run: |
          pip install numpy scipy requests Pillow

      - name: 4. Ejecutar Cerebro del Bot (Python)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: 5. Enviar Reporte de Auditoria (Texto)
        run: |
          # Leemos el reporte generado por Python
          REPORT=$(cat audit_report.txt)
          # Enviamos a Telegram usando la API oficial
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$REPORT" \
            -d parse_mode="Markdown"

      - name: 6. Enviar Nuevo Pronostico (Imagen)
        run: |
          # Enviamos la imagen generada por Python
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="💰 *Nueva Oportunidad Detectada (MXN)* 💰" \
            -F parse_mode="Markdown"

      - name: 7. Guardar y Sincronizar Historial CSV
        run: |
          git config --global user.name "BotPredictor-AI"
          git config --global user.email "bot-ai@github.com"
          git add predictions_history.csv
          # Hacemos commit solo si hubo cambios en el historial
          git commit -m "Actualización de Memoria Histórica [skip ci]" || echo "Sin cambios en el historial"
          git push
