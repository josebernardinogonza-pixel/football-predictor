name: Bot de Apuestas Liga MX Pro

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-4' # L-J 12pm
    - cron: '0 */5 * * 5,6,0' # V-D cada 5h

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v3

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Install Deps
        run: pip install numpy scipy requests Pillow

      - name: 4. Run Cerebro
        env:
          ALL_SPORTS_API_KEY: ${{ secrets.ALL_SPORTS_API_KEY }}
        run: python main.py

      - name: 5. Send Telegram Report
        run: |
          if [ -f audit_report.txt ]; then
            REPORT=$(cat audit_report.txt)
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=$REPORT" \
              -d parse_mode="HTML"
          fi

      - name: 6. Send Telegram Photo
        run: |
          if [ -f prediction_card.png ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
              -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -F photo=@prediction_card.png \
              -F caption="🚨 <b>CARTELERA LIGA MX - JORNADA 14</b>" \
              -F parse_mode="HTML"
          fi

      - name: 7. Save History
        run: |
          git config --global user.name "BotPredictor"
          git config --global user.email "bot@predictor.com"
          git add predictions_history.csv
          git commit -m "Update history Liga MX [skip ci]" || echo "No changes"
          git push
