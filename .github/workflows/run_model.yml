name: Bot de Apuestas Pro (AllSportsAPI)

on:
  workflow_dispatch: # Permite ejecución manual desde el móvil
  schedule:
    # Lunes a Jueves: Una ejecución diaria a las 12:00 PM (18:00 UTC)
    - cron: '0 18 * * 1-4' 
    
    # Viernes a Domingo: Ejecución cada 5 horas para captar jornadas en vivo
    - cron: '0 */5 * * 5,6,0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso crítico para actualizar el historial CSV

    steps:
      - name: 1. Descargar Codigo del Repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar Entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar Librerias (Matematicas e Imagen)
        run: |
          pip install numpy scipy requests Pillow

      - name: 4. Ejecutar Cerebro del Bot (Analisis Pro)
        env:
          # MIGRACIÓN: Ahora usamos la API de Deportes dedicada
          ALL_SPORTS_API_KEY: ${{ secrets.ALL_SPORTS_API_KEY }}
        run: python main.py

      - name: 5. Enviar Reporte de Auditoria a Telegram
        run: |
          # Capturamos el reporte generado por el script de Python
          REPORT=$(cat audit_report.txt)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$REPORT" \
            -d parse_mode="HTML"

      - name: 6. Enviar Tarjeta de Inversion (Imagen)
        run: |
          # Enviamos la infografía generada con los logos de la API
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="🚨 <b>NUEVA OPORTUNIDAD DETECTADA (ALL-SPORTS-DATA)</b>" \
            -F parse_mode="HTML"

      - name: 7. Sincronizar Memoria Historica (CSV)
        run: |
          git config --global user.name "BotPredictor-Pro"
          git config --global user.email "bot-pro@github.com"
          git add predictions_history.csv
          # Guardamos los resultados para que el bot aprenda de la jornada
          git commit -m "Update history with AllSportsAPI data [skip ci]" || echo "No hay cambios para guardar"
          git push
