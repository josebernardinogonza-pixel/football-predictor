name: Bot de Apuestas 100% Autonomo

on:
  workflow_dispatch:
  schedule:
    # Lunes a Jueves: 12:00 PM CDMX (18:00 UTC)
    - cron: '0 18 * * 1-4'
    # Viernes a Domingo: Cada 5 horas
    - cron: '0 */5 * * 5,6,0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install numpy scipy requests Pillow betfairlightweight

      - name: Run Intelligence Engine
        env:
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          ALL_SPORTS_API_KEY: ${{ secrets.ALL_SPORTS_API_KEY }}
        run: python main.py

      - name: Send Telegram Report
        run: |
          REPORT=$(cat audit_report.txt)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$REPORT" \
            -d parse_mode="HTML"

      - name: Send Telegram Infographic
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="🚨 <b>CARTELERA DE INVERSIÓN GENERADA</b>" \
            -F parse_mode="HTML"

      - name: Auto-Save to History
        run: |
          git config --global user.name "BotMaestro"
          git config --global user.email "maestro@bot.com"
          git add predictions_history.csv
          git commit -m "Auto-update history [skip ci]" || echo "No changes"
          git push
