name: Bot de Apuestas Betfair Pro

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-4' # 12:00 PM L-J
    - cron: '0 */5 * * 5,6,0' # Cada 5h V-D

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Deps
        run: pip install numpy scipy requests Pillow betfairlightweight

      - name: Run Cerebro Betfair
        env:
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          ALL_SPORTS_API_KEY: ${{ secrets.ALL_SPORTS_API_KEY }}
        run: python main.py

      - name: Send Telegram
        run: |
          REPORT=$(cat audit_report.txt)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$REPORT" \
            -d parse_mode="HTML"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="🚨 <b>CARTELERA BETFAIR (MXN)</b>" \
            -F parse_mode="HTML"

      - name: Save History
        run: |
          git config --global user.name "BotPredictor"
          git config --global user.email "bot@github.com"
          git add predictions_history.csv
          git commit -m "Update history with Betfair [skip ci]" || echo "No changes"
          git push
