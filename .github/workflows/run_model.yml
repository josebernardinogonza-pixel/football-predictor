name: Bot de Apuestas Live 8h

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Descargar Codigo
        uses: actions/checkout@v3

      - name: 2. Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar Librerias
        run: pip install numpy scipy requests Pillow

      - name: 4. Ejecutar Cerebro del Bot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python main.py

      - name: 5. Enviar Reporte de Auditoria (Texto)
        # Usamos --data-urlencode para que el texto no rompa el comando
        run: |
          REPORT_TEXT=$(cat audit_report.txt)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$REPORT_TEXT" \
            -d parse_mode="HTML"

      - name: 6. Enviar Nuevo Pronostico (Imagen)
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="💰 <b>Análisis en Tiempo Real</b>" \
            -F parse_mode="HTML"

      - name: 7. Guardar Historial
        run: |
          git config --global user.name "BotPredictor"
          git config --global user.email "bot@github.com"
          git add predictions_history.csv
          git commit -m "Update history [skip ci]" || echo "No changes"
          git push
