name: Bot de Apuestas Inteligente 8h
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-4' # L-J a las 12pm CDMX
    - cron: '0 */5 * * 5,6,0' # Fin de semana cada 5h

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Libs
        run: pip install numpy scipy requests Pillow
      - name: Run Bot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python main.py
      - name: Send Telegram
        run: |
          REPORT=$(cat audit_report.txt)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$REPORT" \
            -d parse_mode="HTML"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F photo=@prediction_card.png \
            -F caption="💰 <b>Análisis de Inversión</b>" \
            -F parse_mode="HTML"
      - name: Save CSV
        run: |
          git config --global user.name "BotPredictor"
          git config --global user.email "bot@github.com"
          git add predictions_history.csv
          git commit -m "Update history [skip ci]" || echo "No changes"
          git push
