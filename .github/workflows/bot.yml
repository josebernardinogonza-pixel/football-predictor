name: Bot de Apuestas Inteligente

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 10:00 AM CDMX

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2. Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Install Libs
        run: pip install numpy scipy requests Pillow

      # ... (Pasos anteriores)
      - name: 4. Run Cerebro
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STAKE_API_KEY: ${{ secrets.STAKE_API_KEY }} # LLAVE DIRECTA
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
# ... (Pasos siguientes)

      - name: 5. Enviar Telegram
        run: |
          if [ -f audit_report.txt ]; then
            REPORT=$(cat audit_report.txt)
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=$REPORT" \
              -d parse_mode="HTML"
          fi
          if [ -f prediction_card.png ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
              -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -F photo=@prediction_card.png \
              -F parse_mode="HTML"
          fi

      - name: 6. Sincronizar Memoria (FIX 128)
        run: |
          git config --global user.name "BotMaestro-AI"
          git config --global user.email "maestro@quant.com"
          
          # Guardar cambios locales temporalmente
          git add .
          git stash
          
          # Bajar cambios remotos
          git pull --rebase origin main
          
          # Recuperar cambios del bot
          git stash pop || echo "No hay cambios en stash"
          
          # Subir todo
          git add .
          git commit -m "Update Learning Data [skip ci]" || echo "No changes"
          git push origin main
