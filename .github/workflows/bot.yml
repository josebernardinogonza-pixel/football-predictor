name: Edge Bot Pro - Production Auto-Run

on:
  schedule:
    - cron: '0 * * * *'  # Ejecución cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['training.py', 'bot.py', 'data/**']

permissions:
  contents: write

jobs:
  train-and-predict:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # Usa el token oficial de GitHub Actions para push
      DATA_MIN_ROWS: 15                              # Para coincidir con el parámetro en training.py
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full fetch para push
   
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Crear carpetas de trabajo
        run: mkdir -p models data

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install PyGithub
      
      - name: Fetch Historical Data (if missing or insuficient)
        run: |
          if [ ! -f "data/match_history.csv" ] || [ $(wc -l < data/match_history.csv) -lt $DATA_MIN_ROWS ]; then
            python data/fetch_historical.py
          fi
      
      - name: Train Models (Auto-Improvement)
        run: |
          python training.py
      
      - name: Commit Models & Logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add models/*.pkl 2>/dev/null || true
          git add data/performance_log.csv 2>/dev/null || true
          git add data/match_history.csv 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: Models & Logs [$(date '+%Y-%m-%d %H:%M:%S')]"
            # Push usando token en remoto seguro con variable
            git push origin HEAD:main
          fi
      
      - name: Run Bot (Predictions)
        run: python bot.py
      
      - name: Upload Performance Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-logs
          path: data/performance_log.csv
          retention-days: 30
