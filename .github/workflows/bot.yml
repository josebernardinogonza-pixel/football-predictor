name: Edge Bot Pro - Production Auto-Run

on:
  schedule:
    - cron: '0 * * * *'  # Ejecución cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['training.py', 'bot.py', 'data/**']

# PERMISOS: Necesarios para corregir el error 403 (Permiso denegado)
permissions:
  contents: write

jobs:
  train-and-predict:
    runs-on: ubuntu-latest
    
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Paso para asegurar que las carpetas existan antes de que corra el código
      - name: Crear carpetas de trabajo
        run: mkdir -p models data
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install PyGithub
      
      - name: Fetch Historical Data (if missing)
        run: |
          # Umbral de 100 a 15
          if [ ! -f "data/match_history.csv" ] || [ $(wc -l < data/match_history.csv) -lt 15 ]; then
            python data/fetch_historical.py
          fi
      
      - name: Train Models (Auto-Improvement)
        run: |
          # NOTA: Debes cambiar manualmente el umbral a 15 dentro de training.py 
          # para que coincida con este workflow.
          python training.py
      
      - name: Commit Models & Logs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Agregar archivos solo si existen para evitar errores fatales
          if ls models/*.pkl 1> /dev/null 2>&1; then git add models/*.pkl; fi
          if [ -f "data/performance_log.csv" ]; then git add data/performance_log.csv; fi
          if [ -f "data/match_history.csv" ]; then git add data/match_history.csv; fi
          
          git commit -m "Auto: Models & Logs [$(date)]" || echo "No changes to commit"
          
          # Autenticación explícita para evitar el error 403
          git push https://x-access-token:${{ secrets.TOKEN_GITHUB }}@github.com/${{ github.repository }}.git
      
      - name: Run Bot (Predictions)
        run: python bot.py
      
      - name: Upload Performance Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-logs
          path: data/performance_log.csv
          retention-days: 30
