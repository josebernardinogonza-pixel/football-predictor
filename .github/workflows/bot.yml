name: Bot de Apuestas (Ejecucion 10 AM CDMX)

on:
  workflow_dispatch: # Ejecución manual
  schedule:
    # Se ejecuta todos los días a las 16:00 UTC (10:00 AM CDMX)
    - cron: '0 16 * * *'
    # Mantenemos las ejecuciones de fin de semana cada 5 horas para captar en vivo
    - cron: '0 */5 * * 5,6,0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Deps
        run: pip install numpy scipy requests Pillow betfairlightweight

      - name: Run Cerebro Inteligente
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Sync History
        run: |
          git config --global user.name "BotMaestro-AI"
          git config --global user.email "maestro@quant.com"
          git add data/
          git commit -m "Update Learning Data [skip ci]" || echo "No changes"
          git push
