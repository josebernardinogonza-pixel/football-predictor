name: Edge Bot Pro - Production Auto-Run

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['training.py', 'bot.py', 'data/**']

jobs:
  train-and-predict:
    runs-on: ubuntu-latest
    
    env:
      # Corregido: Faltaba el signo $ inicial en los secrets
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install PyGithub
      
      - name: Ensure Directories Exist
        run: |
          mkdir -p models data
      
      - name: Fetch Historical Data (if missing)
        run: |
          # Solo descarga si el archivo no existe o está vacío
          if [ ! -s "data/match_history.csv" ]; then
            python data/fetch_historical.py || echo "No se pudo obtener data histórica"
          fi
      
      - name: Train Models (Auto-Improvement)
        run: |
          # Nota: Asegúrate de haber corregido el error de sintaxis en la línea 53 de training.py
          python training.py
      
      - name: Commit Models & Logs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Añade archivos solo si existen para evitar el error fatal de Git
          if ls models/*.pkl 1> /dev/null 2>&1; then git add models/*.pkl; fi
          if [ -f "data/performance_log.csv" ]; then git add data/performance_log.csv; fi
          
          # Commit solo si hay cambios detectados
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Models & Performance Log [$(date)]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run Bot (Predictions)
        run: python bot.py
      
      - name: Upload Performance Logs
        if: always() # Se ejecuta aunque fallen pasos anteriores para que veas el log de error
        uses: actions/upload-artifact@v4
        with:
          name: performance-logs
          path: data/performance_log.csv
          retention-days: 30
