name: Bot de Apuestas (Ejecucion 10 AM CDMX)

on:
  workflow_dispatch: # Ejecución manual
  schedule:
    # Se ejecuta todos los días a las 16:00 UTC (10:00 AM CDMX)
    - cron: '0 16 * * *'
    # Mantenemos las ejecuciones de fin de semana cada 5 horas para captar en vivo
    - cron: '0 */5 * * 5,6,0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Deps
        run: pip install numpy scipy requests Pillow betfairlightweight

      - name: Sync History (Blindado)
        run: |
          git config --global user.name "BotMaestro-AI"
          git config --global user.email "maestro@quant.com"
          
          # 1. Intentar descargar cambios remotos para estar al día
          git pull --rebase origin main
          
          # 2. Añadir los archivos generados por el bot
          git add data/ predictions_history.csv audit_report.txt || echo "No hay archivos nuevos"
          
          # 3. Hacer el commit (si hay cambios)
          git commit -m "Update Learning Data [skip ci]" || echo "No hay cambios para guardar"
          
          # 4. Empujar los cambios con un rebase final por seguridad
          git push origin main
