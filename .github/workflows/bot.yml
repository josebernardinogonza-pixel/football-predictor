name: Bot de Apuestas Inteligente

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 10:00 AM CDMX
    - cron: '0 */5 * * 5,6,0' # Fines de semana cada 5h

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Descargar Repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2. Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Instalar Librerias
        run: pip install numpy scipy requests Pillow betfairlightweight

      - name: 4. Ejecutar Cerebro
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALL_SPORTS_API_KEY: ${{ secrets.ALL_SPORTS_API_KEY }}
        run: python bot.py

      - name: 5. Enviar Reporte
        run: |
          if [ -f audit_report.txt ]; then
            REPORT=$(cat audit_report.txt)
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=$REPORT" \
              -d parse_mode="HTML"
          fi

      - name: 6. Enviar Cartelera
        run: |
          if [ -f prediction_card.png ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto \
              -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -F photo=@prediction_card.png \
              -F caption="🚨 <b>NUEVA CARTELERA DE INVERSIÓN</b>" \
              -F parse_mode="HTML"
          fi

      - name: 7. Sincronizar Memoria (Fix Rebase)
        run: |
          git config --global user.name "BotMaestro-AI"
          git config --global user.email "maestro@quant.com"
          git pull --rebase origin main
          git add data/ predictions_history.csv || echo "No changes"
          git commit -m "Update Learning Data [skip ci]" || echo "No changes"
          git push origin main
